# Live-NEST comparison tests for brainpy.state
#
# The `@requires_nest` parity tests (selected by `-m requires_nest`) drive each model in
# live NEST and in brainpy.state and compare them. They need the NEST simulator (installed
# via conda) and number in the hundreds, so they are SLOW and deliberately kept out of the
# per-PR `Continuous Integration` workflow. Run this manually from the Actions tab
# ("Run workflow") when touching the `_nest/` substrate or its validation harness; a weekly
# scheduled run also guards against silent regressions.

name: NEST comparison tests


on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC (off-peak; slow, not a PR gate)


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nest-comparison:
    name: nest-comparison (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Job-level backstop (this is the slow suite — hundreds of live-NEST parity tests).
    # The pytest --timeout below catches a single hung test first; this caps the whole
    # job well under the 6 h GitHub default.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ "3.13" ]
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Conda with Python ${{ matrix.python-version }}
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: test-env
          miniforge-version: latest

      - name: Install NEST simulator
        run: conda install -y -c conda-forge nest-simulator

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-timeout
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e .

      - name: Run live-NEST comparison tests
        # The hundreds of parity tests are JAX/JIT compile-bound; pytest-xdist (-n auto)
        # spreads them across the runner cores. Each worker is a separate process with its
        # own NEST kernel (every test ResetKernel()s), so live NEST is process-safe here
        # (verified locally: the astro parity classes pass under -n auto).
        # --timeout fails (and names) any single test that hangs >15 min instead of
        # stalling a worker; the thread method is used (no SIGALRM dependency).
        env:
          OMP_NUM_THREADS: "1"
        run: pytest brainpy_state/ -m requires_nest -n auto --timeout=900 --timeout-method=thread
