# Static type checking for brainspike
#
# Fast PR/push gate that runs mypy over the shipped package source. The check is
# configured in `[tool.mypy]` in pyproject.toml (pragmatic "real-bug" config:
# real type errors are enforced; whole-codebase `disallow_untyped_defs` is not).
# Test modules are excluded there. This complements CI.yml (runtime tests) by
# guarding the inline type annotations that py.typed now exposes to downstream
# users.

name: Type Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The config pins `python_version = "3.12"` (the support floor); the
          # interpreter version only needs to be >= that for installation.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install package and type checker
        # Installing the package pulls in numpy and the other typed runtime deps
        # so mypy can resolve real imports; the brain*/jax ecosystem is treated as
        # opaque via [[tool.mypy.overrides]], so their stubs are not required.
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e .
          # The private kernel (brainspike/_kernel) imports braintrace. It is a
          # dev/CI-only dependency (requirements-dev.txt) until K3 decides packaging.
          pip install "braintrace>=0.2.6"

      - name: Run mypy
        run: mypy -p brainspike
