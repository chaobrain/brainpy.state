# Continuous Integration for brainpy.state
#
# Fast PR/push gate: runs the test suite on Linux, macOS, and Windows EXCLUDING the
# live-NEST comparison tests (`-m "not requires_nest"`). The NEST comparison suite is
# slow (it installs the NEST simulator via conda and runs ~hundreds of parity tests),
# so it lives in `nest-comparison.yml` and is triggered manually / on a weekly schedule.

name: Continuous Integration


on:
  push:
    branches:
      - main
  pull_request:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.13" ]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flit pytest pytest-xdist
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e .

      - name: Test with pytest (excluding live-NEST comparison)
        # The suite is JAX/JIT compile-bound, so the dominant cost is per-test
        # compilation run serially. pytest-xdist (-n auto) distributes tests across all
        # runner cores -- the single biggest wall-clock win. OMP_NUM_THREADS=1 keeps each
        # worker from oversubscribing the shared cores (compilation is ~single-threaded).
        env:
          OMP_NUM_THREADS: "1"
        run: pytest brainpy_state/ -m "not requires_nest" -n auto
