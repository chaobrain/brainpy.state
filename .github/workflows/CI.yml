# Continuous Integration for brainpy.state
#
# Fast PR/push gate: runs the test suite on Linux, macOS, and Windows EXCLUDING the
# live-NEST comparison tests (`-m "not requires_nest"`). The NEST comparison suite is
# slow (it installs the NEST simulator via conda and runs ~hundreds of parity tests),
# so it lives in `nest-comparison.yml` and is triggered manually / on a weekly schedule.

name: Continuous Integration


on:
  push:
    branches:
      - main
  pull_request:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Job-level backstop so a hung test fails the run in minutes, not the 6 h GitHub
    # default. The pytest --timeout below catches a hang first and names the test; this
    # caps the worst case. macOS/Windows finish ~30 min; ubuntu runs -n 2 (OOM
    # mitigation, see the test step) so it takes ~60 min — 90 leaves headroom.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.13" ]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-timeout
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e .

      - name: Test with pytest (excluding live-NEST comparison)
        # The suite is JAX/JIT compile-bound, so the dominant cost is per-test
        # compilation run serially. pytest-xdist (-n auto) distributes tests across all
        # runner cores -- the single biggest wall-clock win. OMP_NUM_THREADS=1 keeps each
        # worker from oversubscribing the shared cores (compilation is ~single-threaded).
        # --timeout fails (and names) any single test that hangs >10 min instead of
        # stalling the worker until the job is cancelled; the thread method is required
        # because Windows has no SIGALRM.
        #
        # ubuntu runs -n 2, not auto (=4): the 16 GB Linux runner OOMs under 4 concurrent
        # JAX/XLA compilations now that the suite has grown — the VM gets a shutdown
        # signal at ~75% (intermittently, right at the memory edge). macOS passes at 3
        # workers and Windows at 4, so 2 gives ubuntu a safe margin. This ~doubles ubuntu
        # wall-time (hence the 90-min job cap above); macOS/Windows keep -n auto.
        env:
          OMP_NUM_THREADS: "1"
        run: pytest brainpy_state/ -m "not requires_nest" -n ${{ matrix.os == 'ubuntu-latest' && '2' || 'auto' }} --timeout=600 --timeout-method=thread
