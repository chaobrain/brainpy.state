[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainpy_state"
description = "brainpy.state: stateful spiking neural network models in BrainPy"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "brainpy.state Team", email = "chao.brain@qq.com"}
]
license = {text = "GPL-3.0 license"}
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
keywords = [
    "computational neuroscience",
    "brain-inspired computation",
    "brain modeling",
    "brain dynamics modeling",
    "brain dynamics programming"
]
dependencies = [
    "numpy>=1.15",
    "jax",
    "tqdm",
    "brainstate>=0.2.0",
    "brainunit",
    "brainevent>=0.0.4",
    "braintools>=0.0.9",
]

dynamic = ['version']


[project.urls]
"Bug Tracker" = "https://github.com/chaobrain/brainpy.state/issues"
"Documentation" = "https://brainpy_state.readthedocs.io/"
"Source Code" = "https://github.com/chaobrain/brainpy_state"

[project.optional-dependencies]
cpu = [
    "jax[cpu]",
    "brainstate",
    "brainunit",
    "brainevent",
    "braintools",
]
cuda12 = [
    "jax[cuda12]",
    "brainstate",
    "brainunit",
    "brainevent",
    "braintools",
]
cuda13 = [
    "jax[cuda13]",
    "brainstate",
    "brainunit",
    "brainevent",
    "braintools",
]
tpu = [
    "jax[tpu]",
    "brainstate",
    "brainunit",
    "brainevent",
    "braintools",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "lib*",
    "dev*",
    "docs*",
    "tests*",
    "docker*",
    "examples*",
    "scripts",
    "images",
    "dist*",
    "bug*",
]

[tool.setuptools.dynamic]
version = {attr = "brainpy_state.__version__"}
