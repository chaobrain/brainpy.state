[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"


[project]
name = "brainpy_state"
description = "brainpy.state: stateful spiking neural network models in BrainPy"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BrainX Team", email = "chao.brain@qq.com" }
]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
keywords = [
    "computational neuroscience",
    "brain-inspired computation",
    "brain modeling",
    "brain dynamics modeling",
    "brain dynamics programming"
]
dependencies = [
    "numpy>=1.15",
    "jax",
    "brainpy>=2.7.6",
    "brainstate>=0.5.0",
    "brainunit",
    "brainevent>=0.0.4",
    "braintools>=0.0.9",
]
dynamic = ['version']


[tool.setuptools.dynamic]
version = {attr = "brainpy_state._version.__version__"}


[tool.setuptools.packages.find]
include = ["brainpy_state*"]


# Ship the PEP 561 marker so type checkers treat brainpy_state (and its whole
# subpackage tree) as a typed package for downstream users. A single marker at
# the top-level package root is sufficient per PEP 561.
[tool.setuptools.package-data]
brainpy_state = ["py.typed"]


[project.urls]
"Bug Tracker" = "https://github.com/chaobrain/brainpy.state/issues"
"Documentation" = "https://brainx.chaobrain.com/brainpy-state/"
"Source Code" = "https://github.com/chaobrain/brainpy.state"


[project.optional-dependencies]
cpu = ["jax[cpu]"]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]
tpu = ["jax[tpu]"]


[tool.pytest.ini_options]
# Registered so `-m requires_nest` / `-m "not requires_nest"` don't emit an
# "unknown mark" warning on every run. The marker is attached by the
# `@requires_nest` decorator in `_nest/_validation/nest_compare.py`; the live-NEST
# parity classes carry it (run by `nest-comparison.yml`, deselected by the fast CI
# gate). Parallelism (`-n auto`) is set per-workflow in the CI command, not here, so
# local and ad-hoc runs stay serial/explicit by default.
markers = [
    "requires_nest: live-NEST comparison test; needs the NEST simulator installed",
]


[tool.mypy]
# Pragmatic "real-bug" configuration: surface genuine type errors in this
# package without enforcing whole-codebase `disallow_untyped_defs` (which would
# bury the signal under thousands of "missing annotation" notes on JAX/array
# scientific code). Run with `mypy -p brainpy_state`.
python_version = "3.11"
files = ["brainpy_state"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
# The pragmatic config does not check untyped function bodies, so mypy emits a
# non-actionable "annotation-unchecked" note for every annotated local inside
# one; silence that noise.
disable_error_code = ["annotation-unchecked"]
# Test modules intentionally abuse types (mocks, deliberate bad inputs); keep the
# check focused on shipped source.
exclude = '_test\.py$'

# The brain* ecosystem ships py.typed but exposes large dynamically-generated
# namespaces (e.g. brainunit units `u.mV`, `u.ms`) that a static checker cannot
# see, producing ~1700 false "Module has no attribute" errors. Treat these deps
# as opaque so the check focuses on brainpy_state's own type consistency. Other
# untyped scientific deps are ignored the same way.
[[tool.mypy.overrides]]
module = [
    "brainstate.*",
    "brainunit.*",
    "brainevent.*",
    "braintools.*",
    "jax.*",
    "matplotlib.*",
    "scipy.*",
    "nest.*",
]
follow_imports = "skip"
ignore_missing_imports = true
